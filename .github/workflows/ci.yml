name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# One job, one gate list. `npm run verify:full` is the same command a
# contributor runs locally, so a red CI is reproducible in one line.
#
# Do not burn GitHub-hosted minutes for documentation-only commits or every
# temporary implementation/checkpoint branch. Real code reaching main, PRs,
# and explicit manual runs still execute the complete gate.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Portable core · Ubuntu · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the exact lockfile
        run: npm ci --no-audit --no-fund

      - name: Portable CI parity gate
        run: npm run verify:full

      - name: Audit production dependencies
        run: npm audit --omit=dev
