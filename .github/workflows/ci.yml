name: CI

on:
  push:
    branches: ["feat/ocade-implementation", "main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# One job, one gate list. `npm run verify:full` is the same command a
# contributor runs locally, so a red CI is reproducible in one line.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Portable core · Ubuntu · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the exact lockfile
        run: npm ci --no-audit --no-fund

      - name: Portable CI parity gate
        run: npm run verify:full

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocade-portable-core-failure-${{ github.run_id }}
          path: |
            .output/server/wrangler.json
          if-no-files-found: ignore
          retention-days: 3
