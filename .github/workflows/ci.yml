name: CI

on:
  push:
    branches: ["ocade/p00-p22-implementation"]
  workflow_dispatch:

# One job, one gate list. `npm run verify:full` is the same command a
# contributor runs locally, so a red CI is reproducible in one line.
#
# Check every push to the implementation branch on an isolated hosted runner.
# No concurrency group: newer pushes do not cancel earlier checks.
# Manual runs remain available for final exact-commit verification.
permissions:
  contents: read

jobs:
  portable-core:
    name: Portable core · Ubuntu · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the exact lockfile
        run: npm ci --no-audit --no-fund

      - name: Portable CI parity gate
        run: npm run verify:full

      - name: Scan Git history and published artifacts for leaked credentials
        run: |
          npm run audit:history-secrets
          npm run audit:artifact-secrets

      - name: Audit production dependencies
        run: npm audit --omit=dev
