name: CI

on:
  push:
    branches: ["feat/ocade-implementation", "main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# One portable job is the ordinary push/PR authority. Hardware- and
# platform-specific proof lives in platforms.yml and windows-proof.yml, where
# it is manual or deliberately scheduled rather than multiplying every push.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Portable core · Ubuntu · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the exact lockfile
        run: npm ci --no-audit --no-fund

      - name: Portable CI parity gate
        run: npm run verify:full

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocade-portable-core-failure-${{ github.run_id }}
          path: |
            .output/server/wrangler.json
            release/OCADE_RELEASE_BLOCKERS.json
            docs/mission/OCADE_MISSION_EVIDENCE.json
          if-no-files-found: ignore
          retention-days: 3
