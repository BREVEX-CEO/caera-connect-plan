name: OCADE macOS bundle qualification (manual, no deployment)

on:
  push:
    branches: ["ocade/p00-p22-implementation"]
    paths: [".github/workflows/jarvis-macos-package.yml"]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Optional unpublished candidate descended from this branch head"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ocade-mac-package-${{ github.ref }}-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: true

jobs:
  registration:
    name: Register manual bundle checks; syntax only; no credentials
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python -m py_compile device-agent/windows/packaging/ocade-agent.spec device-agent/windows/packaging/check_frozen.py

  package:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ocade/p00-p22-implementation'
    needs: registration
    name: Unsigned bundle and frozen workers; ${{ matrix.os }}; NOT release-ready
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/device-agent/windows/packaging/playwright-browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate branch and candidate ancestry before execution
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ github.sha }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/ocade/p00-p22-implementation ]]
          if [[ -n "$CANDIDATE_SHA" ]]; then
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
            git merge-base --is-ancestor "$BASE_SHA" HEAD
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the locked runtime and test-only builder on the disposable runner
        run: |
          python -m pip install -r device-agent/windows/requirements.txt pyinstaller==6.22.3
          python -m playwright install --no-shell chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root = Path(os.environ["PLAYWRIGHT_BROWSERS_PATH"]).resolve()
          with sync_playwright() as playwright:
              browser = Path(playwright.chromium.executable_path).resolve()
              if not browser.is_file() or not browser.is_relative_to(root):
                  raise RuntimeError("The installed browser is not in the package-local store")
              (root / ".ocade-browser-path").write_text(browser.relative_to(root).as_posix(), encoding="utf-8")
          PY
      - name: Build the app with the existing packaging owner
        working-directory: device-agent/windows/packaging
        run: python -m PyInstaller --noconfirm --distpath ../dist --workpath ../build ocade-agent.spec
      - name: Independently inspect the actual bundle and run frozen workers without developer PATH
        working-directory: device-agent/windows
        run: |
          test -d "dist/OCADE JARVIS.app"
          python - <<'PY' | tee "$RUNNER_TEMP/mac-bundle-facts.jsonl"
          import hashlib
          import json
          import plistlib
          import platform
          from pathlib import Path
          bundle = Path("dist/OCADE JARVIS.app")
          info = plistlib.loads((bundle / "Contents/Info.plist").read_bytes())
          executable = bundle / "Contents/MacOS" / info["CFBundleExecutable"]
          assert executable.is_file(), "The declared bundle executable is missing"
          assert info["CFBundlePackageType"] == "APPL"
          assert info["CFBundleIdentifier"] == "in.ocade.jarvis.companion"
          print("OCADE_MAC_BUNDLE:" + json.dumps({"architecture": platform.machine(), "bundleId": info["CFBundleIdentifier"],
                "version": info["CFBundleShortVersionString"], "executableSha256": hashlib.sha256(executable.read_bytes()).hexdigest(),
                "releaseReady": False}))
          PY
          python packaging/check_frozen.py "dist/OCADE JARVIS.app/Contents/MacOS/ocade-agent" --path "" | tee "$RUNNER_TEMP/mac-frozen-workers.jsonl"
      - name: Retain component proof only; no customer installer is published
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-component-proof-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mac-bundle-facts.jsonl
            ${{ runner.temp }}/mac-frozen-workers.jsonl
          if-no-files-found: ignore
          retention-days: 7
