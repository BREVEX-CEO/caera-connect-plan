name: Platform harnesses

# Device- and toolchain-gated builds: Android, iOS and the Windows desktop
# companion. Each of these needs an SDK, simulator or linker that a normal
# development machine may not have, so this workflow exists to run them where
# those toolchains DO exist.
#
# WHY THIS IS A SEPARATE WORKFLOW, NOT PART OF ci.yml
#
# These are real required platform gates. They run on relevant changes, remain
# manually dispatchable, and also run weekly to expose SDK/toolchain drift.

on:
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "mobile/**"
      - "native/**"
      - "scripts/build-*-sidecar.mjs"
      - "capacitor.config.*"
      - ".github/workflows/platforms.yml"
  push:
    branches: [main, feat/ocade-implementation]
    paths:
      - "android/**"
      - "ios/**"
      - "mobile/**"
      - "native/**"
      - "scripts/build-*-sidecar.mjs"
      - "capacitor.config.*"
      - ".github/workflows/platforms.yml"
  workflow_dispatch:
    inputs:
      run_android:
        description: "Run the Android build and emulator tests"
        type: boolean
        default: true
      run_ios:
        description: "Run the iOS simulator build"
        type: boolean
        default: true
      run_desktop:
        description: "Run the Windows companion build"
        type: boolean
        default: true
  schedule:
    # Weekly, so drift in an SDK or toolchain surfaces on its own rather than
    # at release time.
    - cron: "0 4 * * 1"

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (build + emulator instrumented tests)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      # The mobile shell is a static directory (capacitor webDir=mobile/www), so
      # the web production build is not a prerequisite for syncing it.
      - name: Sync Capacitor web assets into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      # KVM is required for a hardware-accelerated emulator on ubuntu runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocade-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  ios:
    name: iOS (simulator build)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor web assets into the iOS project
        run: npx cap sync ios

      # Simulator build only: a device build needs a signing identity and a
      # provisioning profile, which are deliberately not held in CI.
      - name: Build for the simulator (no code signing)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            build

  desktop-windows:
    name: Windows companion (build + Rust tests)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_desktop }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract OCR
        run: choco install tesseract --yes --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Python control stack
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r native/python-host/requirements.lock.txt
          .\.venv\Scripts\python.exe -m pip check

      - name: Verify Python host and acquire checksummed hand model
        run: |
          npm run python:models
          npm run python:lint
          npm run python:typecheck
          npm run python:test

      - name: Build both bounded native sidecars
        run: |
          npm run browser:sidecar-build
          npm run python:sidecar-build

      - name: Build web app
        run: npm run build

      # windows-latest ships MSVC, so the crate links here and its safety
      # assertions actually execute.
      - name: Safety core tests
        working-directory: native/companion/safety
        run: cargo test --all-targets

      # The companion crate lives in native/companion/tauri (package
      # "caera-companion"); native/companion itself is a plain directory holding
      # safety/, tauri/ and ui/ with no manifest of its own.
      #
      # Unsigned: producing a signed installer needs a certificate, which is a
      # deliberate human step and belongs in release.yml.
      - name: Test the companion against both real sidecars
        working-directory: native/companion/tauri
        shell: pwsh
        run: |
          $env:OCADE_REQUIRE_BROWSER_SIDECAR_TEST = "1"
          $env:OCADE_REQUIRE_PYTHON_SIDECAR_TEST = "1"
          cargo test --all-targets

      - name: Build the companion installer (unsigned)
        run: npm run desktop:bundle:windows

      - name: Upload companion binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocade-companion-windows-installer-unsigned
          path: native/companion/tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
