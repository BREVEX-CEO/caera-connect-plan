name: Platform harnesses

# Device- and toolchain-gated builds: Android, iOS and the Windows desktop
# companion. Each of these needs an SDK, simulator or linker that a normal
# development machine may not have, so this workflow exists to run them where
# those toolchains DO exist.
#
# WHY THIS IS A SEPARATE WORKFLOW, NOT PART OF ci.yml
#
# These jobs exercise the real project layout (capacitor.config.json
# webDir=mobile/www, android/gradlew, ios/App/App.xcodeproj,
# native/companion). Keep them manual/weekly until each platform has produced
# repeatable green evidence and the release signing accounts exist.
#
# So: manual dispatch, plus a weekly run once someone has confirmed a green
# first execution. Promote whichever jobs pass into ci.yml at that point.
#
# STATUS: PREPARED, NOT YET VERIFIED. Do not cite this workflow as evidence
# until an actual run is green.

on:
  workflow_dispatch:
    inputs:
      run_android:
        description: "Run the Android build and emulator tests"
        type: boolean
        default: true
      run_ios:
        description: "Run the iOS simulator build"
        type: boolean
        default: true
      run_desktop:
        description: "Run the Windows companion build"
        type: boolean
        default: true
  schedule:
    # Weekly, so drift in an SDK or toolchain surfaces on its own rather than
    # at release time.
    - cron: "0 4 * * 1"

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (build + emulator instrumented tests)
    if: ${{ github.event_name == 'schedule' || inputs.run_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Capacitor Android 8 compiles its library sources for Java 21.
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # The mobile shell is a static directory (capacitor webDir=mobile/www), so
      # the web production build is not a prerequisite for syncing it.
      - name: Sync Capacitor web assets into the Android project
        run: npx cap sync android

      # Preserve the wrapper's executable bit in Git and repair it defensively
      # for archives or checkouts that strip POSIX mode metadata.
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      # KVM is required for a hardware-accelerated emulator on ubuntu runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocade-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  ios:
    name: iOS (simulator build)
    if: ${{ github.event_name == 'schedule' || inputs.run_ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor web assets into the iOS project
        run: npx cap sync ios

      # Simulator build only: a device build needs a signing identity and a
      # provisioning profile, which are deliberately not held in CI.
      - name: Build for the simulator (no code signing)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  desktop-windows:
    name: Windows companion (build + Rust tests)
    if: ${{ github.event_name == 'schedule' || inputs.run_desktop }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python for packaged hand control
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # windows-latest ships MSVC, so the crate links here and its safety
      # assertions actually execute.
      - name: Safety core tests
        working-directory: native/companion/safety
        run: cargo test --all-targets

      # This builds the required browser and hand-control sidecars before Tauri
      # reads its bundle configuration, then produces the unsigned NSIS
      # installer. A bare `cargo build` intentionally fails on a clean runner
      # when a required sidecar does not exist.
      # Signing remains a separate release-identity step.
      - name: Build the companion installer (unsigned)
        run: npm run desktop:bundle:windows

      - name: Upload companion binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocade-companion-windows-unsigned
          path: |
            native/companion/tauri/target/release/caera-companion.exe
            native/companion/tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
