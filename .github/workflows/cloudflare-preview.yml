name: Cloudflare preview

# A SHAREABLE BUILD THAT CANNOT BECOME PRODUCTION.
#
# `wrangler.json` has `workers_dev: false` and `preview_urls: false`, so the
# production Worker is reachable only at ocade.in and there is no URL to hand
# anybody for a look. Turning either on would give the production script a
# second public address, which is the opposite of what those settings are for.
#
# So this deploys a DIFFERENT Worker — `ocade-web-preview`, derived from the
# build's own generated config — with no routes at all. Nothing addressed to
# ocade.in or www.ocade.in can reach it whatever is deployed, because no route
# points at it. Production is untouched by construction rather than by care.
#
# Manual only. A preview that deploys on every push is a second production
# nobody is watching.

on:
  workflow_dispatch:
    inputs:
      note:
        description: What is being previewed, for the run list
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Build and publish a preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same build production gets. A preview built differently is a
      # preview of something that will never be deployed.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_GOOGLE_ENABLED: ${{ vars.VITE_AUTH_GOOGLE_ENABLED }}
          VITE_AUTH_EMAIL_DELIVERY_READY: ${{ vars.VITE_AUTH_EMAIL_DELIVERY_READY }}
        run: npm run build

      - name: Refuse to publish if this config carries a production route
        # Belt and braces. The generator refuses on its own, but a workflow
        # that trusts a script to guard itself has one check, not two.
        run: |
          node scripts/preview-config.mjs
          CONFIG=.output/server/wrangler.preview.json
          if grep -q '"routes"' "$CONFIG"; then
            echo "preview config declares routes — a preview must have none." >&2
            exit 1
          fi
          if grep -q '"name": "ocade-web"' "$CONFIG"; then
            echo "preview config uses the production Worker name." >&2
            exit 1
          fi

      - name: Deploy the preview Worker
        run: npx wrangler deploy --config .output/server/wrangler.preview.json

      - name: Say where it is
        run: |
          echo "Preview Worker: ocade-web-preview"
          echo "URL: https://ocade-web-preview.<your-workers-subdomain>.workers.dev"
          echo "Production (ocade-web at ocade.in) was not touched by this run."
