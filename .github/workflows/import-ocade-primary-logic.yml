name: Import OCADE primary logic archive

on:
  push:
    branches:
      - import/ocade-primary-logic-20260826
    paths:
      - '.incoming/*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocade-primary-logic-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/import/ocade-primary-logic-20260826'
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: import/ocade-primary-logic-20260826

      - name: Locate and verify archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          expected_sha256='4b9590a17222ba460c26905daba7273076d0bb42163f5a8e6d9cda9076de2e49'
          mapfile -t archives < <(find .incoming -maxdepth 1 -type f -name '*.zip' -print | sort)

          # The extraction commit removes the transfer ZIP. That deletion also
          # matches the workflow path filter and can trigger one follow-up run.
          # Treat that follow-up as a clean no-op instead of a false red build.
          if [ "${#archives[@]}" -eq 0 ] && [ -f imports/ocade-primary-logic/IMPORT_RECEIPT.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Archive already imported; this is the expected post-import deletion event."
            exit 0
          fi

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one .zip in .incoming; found ${#archives[@]}" >&2
            printf '%s\n' "${archives[@]:-}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "Archive SHA-256 mismatch." >&2
            echo "Expected: $expected_sha256" >&2
            echo "Actual:   $actual_sha256" >&2
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "Verified archive SHA-256: $actual_sha256"

      - name: Install dependencies
        if: steps.archive.outputs.skip != 'true'
        shell: bash
        run: npm ci --ignore-scripts

      - name: Extract, classify, and inventory archive
        if: steps.archive.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/import-ocade-primary-logic.mjs '${{ steps.archive.outputs.path }}' --replace

      - name: Verify staged source
        if: steps.archive.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -d imports/ocade-primary-logic/source/src
          test -f imports/ocade-primary-logic/IMPORT_RECEIPT.json
          test -f imports/ocade-primary-logic/SOURCE_INVENTORY.json
          node -e "const r=require('./imports/ocade-primary-logic/IMPORT_RECEIPT.json'); if(r.extractedFileCount < 2000) process.exit(1); if(r.archiveSha256 !== '4b9590a17222ba460c26905daba7273076d0bb42163f5a8e6d9cda9076de2e49') process.exit(1); console.log(r)"

      - name: Remove transfer archive
        if: steps.archive.outputs.skip != 'true'
        shell: bash
        run: rm -f '${{ steps.archive.outputs.path }}'

      - name: Commit extracted staging tree
        if: steps.archive.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imports/ocade-primary-logic .incoming
          if git diff --cached --quiet; then
            echo 'No staged import changes.'
            exit 0
          fi
          git commit -m 'Stage extracted OCADE primary logic source'
          git push origin HEAD:import/ocade-primary-logic-20260826
