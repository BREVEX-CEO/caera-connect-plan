name: OCADE isolated staging E1 (manual, no deployment)

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "E1 or a credential-and-isolation smoke without model calls"
        type: choice
        options: ["e1", "isolation", "benchmark"]
        default: "e1"
      candidate_sha:
        description: "Optional tested candidate descended from this branch head"
        type: string
        required: false
      only:
        description: "Optional space-separated families; partial retest, never full E1 qualification"
        type: string
        required: false
      bench_systems:
        description: "Benchmark runners (plan.md 19.4)"
        type: choice
        options: ["desktop", "windows", "macos", "linux"]
        default: "desktop"
      bench_models:
        description: "Benchmark planner models, space-separated (each plans alone)"
        type: string
        default: "gemini-3.5-flash-lite gemma-4-31b-it"
      seed:
        description: "Paced E1 seed; all runs 48 tasks sequentially"
        type: choice
        options: ["all", "22", "23", "24"]
        default: "all"

permissions:
  contents: read

concurrency:
  group: ocade-staging-live-evaluation
  cancel-in-progress: false

jobs:
  registration:
    name: Validate manual evaluation entry point (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: Validate the exact candidate before any protected credential step
        if: inputs.candidate_sha != ''
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ github.sha }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/ocade/p00-p22-implementation ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
      - run: bash -n scripts/jarvis-e1.sh

  evaluate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ocade/p00-p22-implementation' && inputs.campaign != 'benchmark'
    needs: registration
    name: Real Gemini E1; isolated server and unprivileged companion
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: SUPABASE_SERVICE_ROLE_KEY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact JS dependencies (no credentials)
        run: npm ci --no-audit --no-fund
      - name: Install test-only dependencies and engines on the disposable runner
        if: inputs.campaign != 'isolation'
        run: |
          python3 -m pip install --require-hashes -r device-agent/windows/requirements.lock
          python3 -m pip install reportlab==4.5.1 opentimelineio==0.17.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg libreoffice-calc libreoffice-writer
          python3 -m playwright install --with-deps chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("OCADE_BROWSER_EXECUTABLE=" + p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Create the companion identity without sudo or Docker privileges
        run: |
          sudo useradd --create-home --shell /usr/sbin/nologin ocadelive
          chmod o+rx "$HOME" "$RUNNER_WORKSPACE" "$GITHUB_WORKSPACE"
          id ocadelive
          test "$(id -nG ocadelive)" = ocadelive
      - name: Run paced E1 against staging (server credential in this step only)
        id: evaluation
        # Keep the evaluation budget; reserve job time for setup and scanned evidence.
        timeout-minutes: 330
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E1_SEED: ${{ inputs.seed }}
          E1_ONLY: ${{ inputs.only }}
          STAGING_CAMPAIGN: ${{ inputs.campaign }}
        run: |
          sudo --preserve-env=PATH,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,SUPABASE_SERVICE_ROLE_KEY,OCADE_BROWSER_EXECUTABLE,E1_SEED,E1_ONLY,STAGING_CAMPAIGN,GITHUB_RUN_ID,GITHUB_OUTPUT \
            bash scripts/jarvis-e1.sh
      - name: Retain only credential-scanned evaluation evidence
        if: always() && steps.evaluation.outputs.upload == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e1-${{ inputs.candidate_sha || github.sha }}-${{ github.run_id }}
          path: ${{ steps.evaluation.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14

  # plan.md 19.4: four tasks x two independent planners (O2/O14) on Windows and macOS (Linux optional).
  bench-plan:
    if: inputs.campaign == 'benchmark'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          SYSTEMS: ${{ inputs.bench_systems }}
          MODELS: ${{ inputs.bench_models }}
        run: |
          case "$SYSTEMS" in
            desktop) os='["windows-latest","macos-latest"]' ;;
            windows) os='["windows-latest"]' ;;
            macos) os='["macos-latest"]' ;;
            linux) os='["ubuntu-latest"]' ;;
          esac
          models=$(python3 -c 'import json,os; m=os.environ["MODELS"].split(); assert m and set(m)<={"gemini-3.5-flash-lite","gemma-4-31b-it"}; print(json.dumps(m))')
          echo "matrix={\"os\":$os,\"model\":$models}" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: bench-plan
    if: inputs.campaign == 'benchmark' && github.ref == 'refs/heads/ocade/p00-p22-implementation'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bench-plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    environment: SUPABASE_SERVICE_ROLE_KEY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact dependencies (no credentials)
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --require-hashes -r device-agent/windows/requirements.lock
          python -m pip install opentimelineio==0.17.0
      - name: Install the free benchmark applications (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y --no-progress libreoffice-fresh gimp freecad blender kdenlive ffmpeg
      - name: Install the free benchmark applications (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # No PATH edits: app bundles carry their own python/ffprobe, which would shadow the job's.
          brew install --cask libreoffice gimp freecad blender kdenlive || true
          brew install ffmpeg
      - name: Install the free benchmark applications (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:freecad-maintainers/freecad-stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc gimp freecad blender kdenlive melt ffmpeg xvfb
      - name: Record what is installed (package manager versions; no application is started)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) choco list | grep -iE "libreoffice|gimp|freecad|blender|kdenlive|ffmpeg" || true; ls "/c/Program Files" "$LOCALAPPDATA/Programs" 2>/dev/null | grep -iE "gimp|blender|libre|freecad|kdenlive" || true ;;
            macOS) brew list --cask --versions libreoffice gimp freecad blender kdenlive || true; brew list --versions ffmpeg || true ;;
            Linux) dpkg-query -W libreoffice-calc gimp freecad blender kdenlive ffmpeg || true ;;
          esac
          echo "CapCut: no official Linux build; the Windows/macOS builds need an interactive sign-in, so it is not installed."
      - name: Run the benchmark (server credential in this step only)
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONLY: ${{ inputs.only || 'calc gimp car advert' }}
          MODEL: ${{ matrix.model }}
        run: |
          [[ "$SUPABASE_URL" == https://auyapercxxptziyngycx.supabase.co ]] || { echo "REFUSED: staging only"; exit 2; }
          read -r -a tasks <<< "$ONLY"
          run=(python tests/jarvis/benchmark.py --model "$MODEL" --out bench-out --only "${tasks[@]}")
          if [[ "$RUNNER_OS" == Linux ]]; then xvfb-run -a -s "-screen 0 1920x1080x24" "${run[@]}"; else "${run[@]}"; fi
      - name: Refuse to upload anything that contains the server credential
        id: scan
        if: always()
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, pathlib, sys
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip().encode()
          root = pathlib.Path("bench-out")
          if root.exists() and any(key and key in p.read_bytes() for p in root.rglob("*") if p.is_file()):
              sys.exit("REFUSED: evidence contains the server credential")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.scan.outcome == 'success'
        with:
          name: bench-${{ matrix.os }}-${{ matrix.model }}-${{ github.run_id }}
          path: bench-out
          if-no-files-found: warn
          retention-days: 14
