name: Cloudflare production deployment

on:
  workflow_dispatch:
    inputs:
      deploy_approval:
        description: Type I_APPROVE_OCADE_PRODUCTION_DEPLOY
        required: true
        type: string
      rollback_version_id:
        description: Last verified Cloudflare version ID (used if recovery is needed)
        required: true
        type: string
      expected_asset_state:
        description: Expected staged asset gate state (locked before launch, open after launch)
        required: true
        default: locked
        type: choice
        options:
          - locked
          - open

permissions:
  contents: read

concurrency:
  group: ocade-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy and verify ocade.in
    if: ${{ inputs.deploy_approval == 'I_APPROVE_OCADE_PRODUCTION_DEPLOY' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OCADE_DEPLOY_HEALTH_URL: https://ocade.in/api/health
      OCADE_DEPLOY_APPROVAL: ${{ inputs.deploy_approval }}
      OCADE_ROLLBACK_VERSION_ID: ${{ inputs.rollback_version_id }}
      OCADE_DEPLOY_EXPECT_ASSET_STATE: ${{ inputs.expected_asset_state }}
      OCADE_SUPABASE_PROJECT_REF: sazhgaisyhkdbrooycdv
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_AUTH_GOOGLE_ENABLED: ${{ vars.VITE_AUTH_GOOGLE_ENABLED || 'false' }}
      VITE_AUTH_APPLE_ENABLED: ${{ vars.VITE_AUTH_APPLE_ENABLED || 'false' }}
      VITE_AUTH_PHONE_ENABLED: ${{ vars.VITE_AUTH_PHONE_ENABLED || 'false' }}
      VITE_AUTH_EMAIL_DELIVERY_READY: ${{ vars.VITE_AUTH_EMAIL_DELIVERY_READY || 'false' }}
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify every gate on the exact tree being deployed
        run: npm run verify:full

      - name: Deploy and independently verify the production health endpoint
        run: npm run deploy:web
