name: Cloudflare production deployment

on:
  workflow_dispatch:
    inputs:
      deploy_approval:
        description: Type I_APPROVE_OCADE_PRODUCTION_DEPLOY
        required: true
        type: string
      rollback_version_id:
        description: Last verified Cloudflare version ID (used if recovery is needed)
        required: true
        type: string
      expected_asset_state:
        description: Expected staged asset gate state (locked before launch, open after launch)
        required: true
        default: locked
        type: choice
        options:
          - locked
          - open

permissions:
  contents: read

concurrency:
  group: ocade-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy and verify ocade.in
    if: ${{ inputs.deploy_approval == 'I_APPROVE_OCADE_PRODUCTION_DEPLOY' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OCADE_DEPLOY_HEALTH_URL: https://ocade.in/api/health
      OCADE_DEPLOY_APPROVAL: ${{ inputs.deploy_approval }}
      OCADE_ROLLBACK_VERSION_ID: ${{ inputs.rollback_version_id }}
      OCADE_DEPLOY_EXPECT_ASSET_STATE: ${{ inputs.expected_asset_state }}
      OCADE_SUPABASE_PROJECT_REF: sazhgaisyhkdbrooycdv
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_AUTH_GOOGLE_ENABLED: ${{ vars.VITE_AUTH_GOOGLE_ENABLED || 'false' }}
      VITE_AUTH_APPLE_ENABLED: ${{ vars.VITE_AUTH_APPLE_ENABLED || 'false' }}
      VITE_AUTH_PHONE_ENABLED: ${{ vars.VITE_AUTH_PHONE_ENABLED || 'false' }}
      VITE_AUTH_EMAIL_DELIVERY_READY: ${{ vars.VITE_AUTH_EMAIL_DELIVERY_READY || 'false' }}
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and operations gates
        run: |
          npm run typecheck
          npm test
          npm run release:source-check
          npm run operations:check
          npm run performance:budget

      - name: Deploy and independently verify the production health endpoint
        run: npm run deploy:web

      - name: Verify Google OAuth review surface while launch remains locked
        if: ${{ inputs.expected_asset_state == 'locked' }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          fetch_page() {
            local path="$1"
            local name="$2"
            curl --silent --show-error --location \
              --retry 8 --retry-delay 3 --retry-all-errors \
              --dump-header "$work/$name.headers" \
              --output "$work/$name.body" \
              --write-out '%{http_code}' \
              "https://ocade.in$path"
          }

          home_status="$(fetch_page / home)"
          privacy_status="$(fetch_page /privacy privacy)"
          terms_status="$(fetch_page /terms terms)"
          auth_status="$(fetch_page /auth auth)"

          test "$home_status" = "200"
          test "$privacy_status" = "200"
          test "$terms_status" = "200"
          test "$auth_status" = "503"

          grep -Fq 'OCADE is a local-first AI workspace' "$work/home.body"
          grep -Fq 'href="/privacy"' "$work/home.body"
          grep -Fq 'href="/terms"' "$work/home.body"
          grep -Fq 'Privacy notice' "$work/privacy.body"
          grep -Fq 'Terms of service' "$work/terms.body"

          ! cmp -s "$work/home.body" "$work/privacy.body"
          ! cmp -s "$work/home.body" "$work/terms.body"
          ! cmp -s "$work/privacy.body" "$work/terms.body"

          grep -Eiq '^x-robots-tag:.*index' "$work/home.headers"
          grep -Eiq '^x-robots-tag:.*index' "$work/privacy.headers"
          grep -Eiq '^x-robots-tag:.*index' "$work/terms.headers"
          grep -Eiq '^x-robots-tag:.*noindex' "$work/auth.headers"
          grep -Eiq '^x-ocade-launch-state:[[:space:]]*prelaunch' "$work/auth.headers"

          echo 'Verified: public Home/Privacy/Terms are distinct and /auth remains launch-locked.'
