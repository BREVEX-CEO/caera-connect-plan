name: Cloudflare production deployment

on:
  workflow_dispatch:
    inputs:
      deploy_approval:
        description: Type I_APPROVE_OCADE_PRODUCTION_DEPLOY
        required: true
        type: string
      rollback_version_id:
        description: Currently deployed Cloudflare version ID (the deploymentId at /api/health)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ocade-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy and verify ocade.in
    if: ${{ inputs.deploy_approval == 'I_APPROVE_OCADE_PRODUCTION_DEPLOY' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OCADE_DEPLOY_HEALTH_URL: https://ocade.in/api/health
      OCADE_DEPLOY_APPROVAL: ${{ inputs.deploy_approval }}
      OCADE_ROLLBACK_VERSION_ID: ${{ inputs.rollback_version_id }}
      OCADE_SUPABASE_PROJECT_REF: sazhgaisyhkdbrooycdv
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify every gate on the exact tree being deployed
        run: npm run verify:full

      - name: Deploy and independently verify the production health endpoint
        run: npm run deploy:web
