# Only implementation-branch, no-deploy, no-provider-secret validation.
# GitHub standard hosted runners are free on public repositories; no larger runners.
name: JARVIS cloud validation (no deployment)

on:
  push:
    branches: ["ocade/p00-p22-implementation"]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Optional unpublished candidate commit descended from this branch head"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: jarvis-cloud-${{ github.ref }}-${{ inputs.candidate_sha || 'branch' }}
  cancel-in-progress: true

jobs:
  coding-gate:
    name: Coding gate · Linux · no qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: jarvis_disposable_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: jarvis_disposable_ci_only
      OCADE_DB_ADVISORS: "1"
      CODING_BASE_SHA: fdc5b21a72c54a29fe98e0d3e7fa544679b104aa
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate branch and optional candidate before execution
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ github.sha }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/ocade/p00-p22-implementation ]]
          if [[ -n "$CANDIDATE_SHA" ]]; then
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
            git merge-base --is-ancestor "$BASE_SHA" HEAD
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact coding dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r device-agent/windows/requirements.txt
      - name: Install focused integration prerequisites
        run: |
          python -m pip install reportlab==4.5.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client libreoffice-calc libreoffice-writer
      - name: Source formatting
        run: npm run format:check
      - name: TypeScript compilation
        if: success() || failure()
        run: npm run typecheck
      - name: Compile every companion module and packaging check
        if: success() || failure()
        run: |
          python -m compileall -q device-agent/windows/ocade_agent device-agent/windows/packaging tests/jarvis
          python -m py_compile device-agent/windows/packaging/ocade-agent.spec
          node --check scripts/jarvis-live.mjs
      - name: Import every companion module without starting the agent
        if: success() || failure()
        working-directory: device-agent/windows
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import ocade_agent
          for module in pkgutil.iter_modules(ocade_agent.__path__, "ocade_agent."):
              if module.name != "ocade_agent.__main__":
                  importlib.import_module(module.name)
                  print("IMPORTED:" + module.name)
          PY
      - name: Canonical protocol and capability-only production paths
        if: success() || failure()
        run: |
          npm run jarvis:protocol-check
          npm run jarvis:no-hardcoded
      - name: Existing TypeScript safety and contract tests
        if: success() || failure()
        run: node --experimental-strip-types --no-warnings --test tests/security/*.test.ts tests/jarvis/contracts.test.ts tests/jarvis/e2e.test.ts
      - name: Required-test gate and effect-scope regressions
        if: success() || failure()
        working-directory: device-agent/windows
        run: python -m tests.run_required --tests tests.test_required_runner --tests tests.test_effect_scope --tests tests.test_agent_recovery
      - name: Evaluation bookkeeping and fixture regressions without model calls
        if: success() || failure()
        env:
          PYTHONPATH: device-agent/windows:tests/jarvis
        run: python -m tests.run_required --tests test_eval_audit
      - name: Migrations and authority contracts when changed
        if: success() || failure()
        run: |
          status=0
          git diff --quiet "${CODING_BASE_SHA:-HEAD^}" HEAD -- supabase/ src/lib/jarvis/authority.server.ts tests/jarvis/db/ || status=$?
          case "$status" in
            0) ;;
            1) npm run test:jarvis-db ;;
            *) exit "$status" ;;
          esac

      - name: Show exact formatter corrections for changed sources
        if: failure()
        run: |
          node --input-type=module - <<'JS'
          import fs from "node:fs";
          import {execFileSync} from "node:child_process";
          import prettier from "prettier";
          const paths=execFileSync("git", ["diff","--name-only",process.env.CODING_BASE_SHA || "HEAD^","HEAD"], {encoding:"utf8"}).trim().split("\n");
          for (const path of paths) {
            if (!fs.existsSync(path)) continue;
            const info=await prettier.getFileInfo(path,{ignorePath:".prettierignore"});
            if (info.ignored || !info.inferredParser) continue;
            const original=fs.readFileSync(path,"utf8");
            const content=await prettier.format(original,{...await prettier.resolveConfig(path),filepath:path});
            if (content!==original) console.log("OCADE_FORMAT:"+JSON.stringify({path,content}));
          }
          JS

  planner-safety:
    if: github.event_name == 'workflow_dispatch'
    name: Planner safety / source formatting · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: Validate unpublished candidate ancestry before execution
        if: inputs.candidate_sha != ''
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ github.sha }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/ocade/p00-p22-implementation ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Planner safety and sibling contracts (synthetic provider, loopback only)
        run: node --experimental-strip-types --no-warnings --test tests/security/*.test.ts tests/jarvis/contracts.test.ts
      - name: Filesystem race regressions (standard library only)
        env:
          PYTHONPATH: device-agent/windows
        run: python -m unittest discover -s device-agent/windows/tests -p test_sandbox.py -v
      - name: Effect scope propagation and isolation (standard library only, no skips)
        env:
          PYTHONPATH: device-agent/windows
        working-directory: device-agent/windows
        run: python -m tests.run_required --tests tests.test_effect_scope
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: success() || failure()
        with:
          python-version: "3.12"
      - name: Install locked runtime for focused real-worker safety checks
        if: success() || failure()
        run: python -m pip install -r device-agent/windows/requirements.txt
      - name: Install the real media engine for containment controls
        if: success() || failure()
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Media nested-source containment (required, no skips)
        if: success() || failure()
        working-directory: device-agent/windows
        run: python -m tests.run_required --tests tests.test_media_scope
      - name: Gateway result boundary and opaque read uncertainty (required, no skips)
        if: success() || failure()
        working-directory: device-agent/windows
        run: python -m tests.run_required --tests tests.test_gateway.ResultBoundary
      - name: Durable intent identity and interrupted read recovery (required, no skips)
        if: success() || failure()
        working-directory: device-agent/windows
        run: python -m tests.run_required --tests tests.test_agent_recovery
      - name: Verifier collisions and unrelated-file preservation (real MCP workers)
        if: success() || failure()
        working-directory: device-agent/windows
        run: python -m unittest tests.test_gateway.Journey.test_document_destinations_must_be_distinct_before_any_publication tests.test_gateway.Journey.test_a_refusal_before_writing_cannot_claim_a_possible_effect tests.test_gateway.Journey.test_verifier_preserves_workbook_scalar_types tests.test_gateway.Journey.test_duplicate_verifier_ids_cannot_erase_a_failed_check tests.test_gateway.Journey.test_repair_preserves_an_unrelated_hidden_staging_name tests.test_gateway.Journey.test_repeated_repairs_keep_distinct_exact_originals -v
      - name: Install isolated browser fixture prerequisites
        if: success() || failure()
        run: |
          python -m pip install reportlab==4.5.1
          python -m playwright install --no-shell chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("OCADE_BROWSER_EXECUTABLE=" + p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Media sibling regressions (real files and independent measurements, no skips)
        if: success() || failure()
        working-directory: device-agent/windows
        run: python -m tests.run_required --tests tests.test_media.Media.test_image_facts --tests tests.test_media.Media.test_preview_lets_the_planner_see_images_and_video --tests tests.test_media.Media.test_video_inspect_trim_and_verify --tests tests.test_media.Media.test_titles_are_drawn_without_relying_on_the_local_ffmpeg_build --tests tests.test_media.Media.test_timeline_edit_is_exact_and_independently_measured
      - name: Required real-browser address and lifecycle cases (no skips)
        if: success() || failure()
        working-directory: device-agent/windows
        run: xvfb-run -a python -m tests.run_required --tests tests.test_web.WebLadder.test_observed_addresses_are_exact_including_fragments_or_explicitly_omitted --tests tests.test_web.WebLadder.test_mcp_lifespan_closes_browser_and_failed_startup --tests tests.test_web.WebLadder.test_download_refusal_after_the_click_preserves_effect_uncertainty
      - name: Actor bound-host request prevention and CDN control (required, no skips)
        if: success() || failure()
        working-directory: device-agent/windows
        run: xvfb-run -a python -m tests.run_required --tests tests.test_web_scope
      - name: Rendered verifier and URL transport negative controls (required, no skips)
        if: success() || failure()
        working-directory: device-agent/windows
        run: xvfb-run -a python -m tests.run_required --tests tests.test_verify_web
      - name: Restore script syntax and refusal outside disposable CI
        if: success() || failure()
        run: |
          bash -n tests/jarvis/db/restore.sh
          if output=$(env -u GITHUB_ACTIONS bash tests/jarvis/db/restore.sh 2>&1); then
            echo "FAIL: restore accepted an unauthorized environment"
            exit 1
          else
            status=$?
            test "$status" -eq 2
            test "$output" = "REFUSED: a disposable GitHub Actions PostgreSQL service is required."
          fi
      - name: Validate the actual readiness contract
        if: success() || failure()
        run: npm run readiness
      - name: Packaging qualification scripts compile
        if: success() || failure()
        run: python -m py_compile device-agent/windows/packaging/check_frozen.py device-agent/windows/packaging/compare_browser_payloads.py
      - name: Canonical protocol matches the checked-in companion contract
        if: success() || failure()
        run: npm run jarvis:protocol-check
      - name: TypeScript safety before the platform matrix
        if: success() || failure()
        run: npm run typecheck
      - name: Source formatting
        if: success() || failure()
        run: npm run format:check
      - name: Formatting evidence for failed remote candidates
        if: failure()
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import prettier from "prettier"; for (const path of process.argv.slice(1)) console.log("OCADE_FORMAT:" + JSON.stringify({path, content: await prettier.format(fs.readFileSync(path, "utf8"), {...await prettier.resolveConfig(path), filepath:path})}));' src/lib/jarvis/contracts.ts src/lib/jarvis/planner.server.ts tests/security/planner.test.ts tests/security/verification.test.ts tests/security/readiness.test.ts tests/security/recovery.test.ts tests/security/verifier-scope.test.ts tests/security/traceability.test.ts tests/security/objective.test.ts tests/security/confirmation.test.ts src/lib/jarvis/authority.server.ts src/lib/jarvis/supervisor.ts scripts/launch-readiness.mjs tests/jarvis/contracts.test.ts tests/jarvis/e2e.test.ts src/lib/jarvis/objective.ts src/lib/jarvis/functions.ts src/jarvis/JarvisWorkspace.tsx src/jarvis/JarvisBubble.tsx src/routes/ocade-jarvis.tsx ToRemove.md evidence/readiness/gates.json .github/workflows/jarvis-cloud-validation.yml

  windows-effects-safety:
    if: github.event_name == 'workflow_dispatch'
    name: Native receipt / COM / process safety · Windows
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the locked runtime (synthetic failure contracts only)
        run: python -m pip install -r device-agent/windows/requirements.txt
      - name: Native bridge dispatch/readback, COM balance and owned process exit (required, no skips)
        working-directory: device-agent/windows
        run: python -m tests.run_required --tests tests.test_effect_receipts --tests tests.test_quiescence
      - name: Native exit status, independent rerun and suspended-window regressions
        working-directory: device-agent/windows
        run: python -m tests.run_required --tests tests.test_shell.Shell.test_native_exit_codes_and_later_shell_results_are_preserved --tests tests.test_verify_kinds.VerifierKinds.test_a_repaired_program_is_rerun_in_a_throwaway_copy --tests tests.test_verify_kinds.VerifierKinds.test_a_native_success_cannot_mask_a_later_shell_error --tests tests.test_windows_ui.WindowsUiLadder.test_ui_ladder

  database-safety:
    if: github.event_name == 'workflow_dispatch'
    name: Permission revocation / receipt locks · disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: jarvis_disposable_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: jarvis_disposable_ci_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install disposable database client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Replay migrations and test authority, complete requests and verifier revocation
        run: bash tests/jarvis/db/run.sh

      - name: Generate held-claim migration filename in an unlinked CLI project
        if: success() || failure()
        run: |
          candidate="$RUNNER_TEMP/ocade-held-migration-$GITHUB_RUN_ID"
          mkdir -p "$candidate"
          npx --yes supabase@2.122.0 init --workdir "$candidate"
          npx --yes supabase@2.122.0 migration new fence_revoked_claims_and_receipt_locks --workdir "$candidate"
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const folder=path.join(process.env.RUNNER_TEMP,"ocade-held-migration-"+process.env.GITHUB_RUN_ID,"supabase","migrations"); const files=fs.readdirSync(folder); if(files.length!==1||!/^\d{14}_fence_revoked_claims_and_receipt_locks\.sql$/.test(files[0])) throw new Error("unexpected CLI migration output"); console.log("OCADE_HELD_MIGRATION_FILENAME:"+JSON.stringify({name:files[0],scope:"unlinked disposable runner project only"}));'

  contracts-db:
    if: github.event_name == 'workflow_dispatch'
    needs: [planner-safety, windows-effects-safety, database-safety]
    name: Portable build / model contracts / ephemeral DB · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: jarvis_disposable_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: jarvis_disposable_ci_only
      # Placeholder client configuration for the audited CI build: no real project is named or reached.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact JS dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install companion runtime for end-to-end tests (test runner only)
        run: python -m pip install -r device-agent/windows/requirements.txt
      - name: Install disposable Postgres test client and the office engine the workers drive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client libreoffice-calc libreoffice-writer
      - name: Standard source and build gates
        run: bash scripts/ci-local.sh --core-only
      - name: JARVIS protocol matches checked-in contracts
        if: success() || failure()
        run: npm run jarvis:protocol-check
      - name: No application-specific production journeys
        if: success() || failure()
        run: npm run jarvis:no-hardcoded
      - name: JARVIS contracts, safety and end-to-end diagnostics after a gate failure
        if: failure()
        run: node --experimental-strip-types --no-warnings --test tests/jarvis/*.test.ts tests/security/*.test.ts
      - name: Disposable database diagnostics after a gate failure
        if: failure()
        run: npm run test:jarvis-db
      - name: Logical backup restore and corrupt-archive negative control (fresh runner databases only)
        if: success() || failure()
        env:
          OCADE_DISPOSABLE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash tests/jarvis/db/restore.sh
      - name: Website surface audit (built site served locally; every reachable page, desktop and phone)
        if: success() || failure()
        run: |
          python -m playwright install chromium
          test -f .output/server/index.mjs || npm run build
          npx wrangler dev --ip 127.0.0.1 --port 8787 --local > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8787/ && break; sleep 2; done
          python tests/web/surface_audit.py http://127.0.0.1:8787
          python tests/web/objective_handoff.py http://127.0.0.1:8787
      - name: Launch readiness is computed only from existing evidence
        if: success() || failure()
        run: |
          npm run readiness -- --write
          node --input-type=module -e 'import fs from "node:fs"; console.log("OCADE_READINESS:" + JSON.stringify(fs.readFileSync("evidence/readiness/READINESS.md", "utf8")));'
      - name: Known-vulnerability audit of shipped dependencies (web and companion)
        if: success() || failure()
        run: |
          npm audit --omit=dev
          python -m pip install pip-audit==2.10.1
          pip-audit -r device-agent/windows/requirements.txt

  companion-cross-platform:
    if: github.event_name == 'workflow_dispatch'
    needs: [planner-safety, contracts-db]
    name: Python MCP / journal / browser · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked companion dependencies on test runner only
        run: python -m pip install -r device-agent/windows/requirements.txt
      - name: Install test-only PDF fixture builder and timeline reader (never shipped to customers)
        run: python -m pip install reportlab==4.5.1 opentimelineio==0.17.0
      - name: Install test-only Chromium
        run: python -m playwright install chromium
      - name: Expose the installed Playwright browser executable to fixture tests
        shell: bash
        run: |
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("OCADE_BROWSER_EXECUTABLE=" + p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Install test-runner engines (ffmpeg, LibreOffice) on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libreoffice-calc libreoffice-writer
      - name: Install test-runner engines (ffmpeg, LibreOffice) on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # Not added to PATH: LibreOffice's folder holds its own python.exe, and OCADE finds it where it installs.
        run: choco install ffmpeg libreoffice-fresh --yes --no-progress
      - name: Install test-runner engines (ffmpeg, LibreOffice) on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          if [[ "$(uname -m)" == x86_64 ]]; then
            python scripts/ci-macos-media.py
          else
            brew install ffmpeg
          fi
          brew install --cask libreoffice
      # Every skip must be one this OS is allowed; any other skipped test fails the job.
      - name: Linux companion tests (real Chromium on a disposable Xvfb desktop)
        if: runner.os == 'Linux'
        working-directory: device-agent/windows
        run: bash ../../scripts/ci-local.sh --companion-only
      - name: Windows companion tests (real desktop UI, browser, shell)
        if: runner.os == 'Windows'
        working-directory: device-agent/windows
        run: python -m tests.run_required "Start-Process children do not inherit the command's output" "needs a Mac desktop with Accessibility granted" "needs a display and OCADE_PUBLIC_WEB=1"
      - name: Probe whether this macOS runner grants Accessibility trust (decides if AX can be qualified here)
        if: runner.os == 'macOS'
        run: python -c "import ctypes; ax = ctypes.cdll.LoadLibrary('/System/Library/Frameworks/ApplicationServices.framework/ApplicationServices'); print('AXIsProcessTrusted =', ax.AXIsProcessTrusted())"
      - name: macOS companion tests
        if: runner.os == 'macOS'
        working-directory: device-agent/windows
        run: python -m tests.run_required "needs a Windows desktop" "needs Windows process handles" "needs Windows UI Automation and COM" "needs a display and OCADE_PUBLIC_WEB=1"
      # These tests exercise portable contracts; they do NOT establish real
      # foreground UI automation, macOS AX, customer pairing, or actual media quality.

  windows-installer-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: [planner-safety, contracts-db]
    name: Windows unsigned installer / frozen MCP smoke · NOT release-ready
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0" # a fixed hash seed is part of a reproducible PyInstaller build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build-only Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Measure the original full browser payload from the same pinned SDK
        shell: pwsh
        run: |
          python -m pip install playwright==1.64.1
          $baseline = Join-Path $env:RUNNER_TEMP "ocade-browser-baseline"
          "OCADE_BROWSER_BASELINE=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:PLAYWRIGHT_BROWSERS_PATH = $baseline
          python -m playwright install chromium
      - name: Build disposable unsigned companion installer
        shell: pwsh
        run: |
          # PyInstaller stamps the build time into each Windows executable unless this is set.
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          "SOURCE_DATE_EPOCH=$env:SOURCE_DATE_EPOCH" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./device-agent/windows/packaging/build.ps1
      - name: Only the unused headless shell was removed; retained browser files are identical
        shell: pwsh
        run: |
          & ./device-agent/windows/.build-venv/Scripts/python.exe ./device-agent/windows/packaging/compare_browser_payloads.py "$env:OCADE_BROWSER_BASELINE" "device-agent/windows/packaging/playwright-browsers"
      - name: Verify all frozen MCP workers and the real bundled browser actually start
        shell: pwsh
        run: |
          & ./device-agent/windows/.build-venv/Scripts/python.exe ./device-agent/windows/packaging/check_frozen.py "device-agent/windows/dist/OCADE JARVIS/ocade-agent.exe"
      - name: Rebuild the frozen bundle from the same inputs and require identical files
        shell: pwsh
        working-directory: device-agent/windows/packaging
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path (Get-Location) "playwright-browsers"
          ..\.build-venv\Scripts\pyinstaller --noconfirm --distpath ..\dist2 --workpath ..\build2 ocade-agent.spec
          ..\.build-venv\Scripts\python compare_builds.py "..\dist\OCADE JARVIS" "..\dist2\OCADE JARVIS"
          $stamp = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:SOURCE_DATE_EPOCH).UtcDateTime
          Get-ChildItem ..\dist2 -Recurse -File | ForEach-Object { $_.LastWriteTimeUtc = $stamp }
          iscc /DDist=..\dist2 /O"Output2" ocade-agent.iss  # the second installer from the second, rebuilt bundle
          ..\.build-venv\Scripts\python compare_builds.py Output Output2
      - name: Installer lifecycle - install, diagnose, repair, uninstall; the person's files survive
        shell: pwsh
        run: ./device-agent/windows/packaging/test_install.ps1 -Installer "device-agent/windows/packaging/Output/OCADE-JARVIS-Setup-0.1.0.exe"
      - name: Verify expected installer exists
        shell: pwsh
        run: |
          $installer = "device-agent/windows/packaging/Output/OCADE-JARVIS-Setup-0.1.0.exe"
          if (!(Test-Path $installer)) { throw "Installer missing: $installer" }
          Get-FileHash $installer -Algorithm SHA256 | Select-Object -Property Algorithm,Hash
          Write-Output ("OCADE_INSTALLER_BYTES:" + (Get-Item -LiteralPath $installer).Length)
      # No publishing, signing, user-PC control, deploy, provider calls or secrets.
