# Only implementation-branch, no-deploy, no-provider-secret validation.
# GitHub standard hosted runners are free on public repositories; no larger runners.
name: JARVIS cloud validation (no deployment)

on:
  push:
    branches: ["ocade/p00-p22-implementation"]
    paths:
      - ".github/workflows/jarvis-cloud-validation.yml"
      - "src/lib/jarvis/**"
      - "src/jarvis/**"
      - "src/routes/ocade-jarvis.tsx"
      - "src/lib/intelligence/**"
      - "src/routes/api/jarvis.device.ts"
      - "device-agent/**"
      - "tests/jarvis/**"
      - "tests/security/**"
      - "tests/web/**"
      - "scripts/jarvis-*.mjs"
      - "scripts/jarvis-protocol.ts"
      - "scripts/verify-full.mjs"
      - "package.json"
      - "package-lock.json"
      - "supabase/migrations/**"
      - "CLAUDE.md"
      - "plan.md"
      - "evidence/readiness/**"
      # Generated report only; authoritative gates.json still triggers full qualification.
      - "!evidence/readiness/READINESS.md"
      - "scripts/launch-readiness.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner-safety:
    name: Planner safety / source formatting · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Planner safety and sibling contracts (synthetic provider, loopback only)
        run: node --experimental-strip-types --no-warnings --test tests/security/*.test.ts tests/jarvis/contracts.test.ts
      - name: Filesystem race regressions (standard library only)
        env:
          PYTHONPATH: device-agent/windows
        run: python -m unittest discover -s device-agent/windows/tests -p test_sandbox.py -v
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: success() || failure()
        with:
          python-version: "3.12"
      - name: Install locked runtime for focused real-worker safety checks
        if: success() || failure()
        run: python -m pip install -r device-agent/windows/requirements.txt
      - name: Verifier collisions and unrelated-file preservation (real MCP workers)
        if: success() || failure()
        working-directory: device-agent/windows
        run: python -m unittest tests.test_gateway.Journey.test_document_destinations_must_be_distinct_before_any_publication tests.test_gateway.Journey.test_a_refusal_before_writing_cannot_claim_a_possible_effect tests.test_gateway.Journey.test_verifier_preserves_workbook_scalar_types tests.test_gateway.Journey.test_duplicate_verifier_ids_cannot_erase_a_failed_check tests.test_gateway.Journey.test_repair_preserves_an_unrelated_hidden_staging_name tests.test_gateway.Journey.test_repeated_repairs_keep_distinct_exact_originals -v
      - name: Install isolated browser fixture prerequisites
        if: success() || failure()
        run: |
          python -m pip install reportlab==4.5.1
          python -m playwright install --no-shell chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("OCADE_BROWSER_EXECUTABLE=" + p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Required real-browser address and lifecycle cases (no skips)
        if: success() || failure()
        working-directory: device-agent/windows
        run: xvfb-run -a python -c 'import sys, unittest; suite=unittest.defaultTestLoader.loadTestsFromNames(["tests.test_web.WebLadder.test_observed_addresses_are_exact_including_fragments_or_explicitly_omitted", "tests.test_web.WebLadder.test_mcp_lifespan_closes_browser_and_failed_startup", "tests.test_web.WebLadder.test_download_refusal_after_the_click_preserves_effect_uncertainty"]); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if result.wasSuccessful() and result.testsRun == 3 and not result.skipped else 1)'
      - name: Restore script syntax and refusal outside disposable CI
        if: success() || failure()
        run: |
          bash -n tests/jarvis/db/restore.sh
          if output=$(env -u GITHUB_ACTIONS bash tests/jarvis/db/restore.sh 2>&1); then
            echo "FAIL: restore accepted an unauthorized environment"
            exit 1
          else
            status=$?
            test "$status" -eq 2
            test "$output" = "REFUSED: a disposable GitHub Actions PostgreSQL service is required."
          fi
      - name: Validate the actual readiness contract
        if: success() || failure()
        run: npm run readiness
      - name: Packaging qualification scripts compile
        if: success() || failure()
        run: python -m py_compile device-agent/windows/packaging/check_frozen.py device-agent/windows/packaging/compare_browser_payloads.py
      - name: TypeScript safety before the platform matrix
        if: success() || failure()
        run: npm run typecheck
      - name: Source formatting
        if: success() || failure()
        run: npm run format:check
      - name: Formatting evidence for failed remote candidates
        if: failure()
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import prettier from "prettier"; for (const path of process.argv.slice(1)) console.log("OCADE_FORMAT:" + JSON.stringify({path, content: await prettier.format(fs.readFileSync(path, "utf8"), {...await prettier.resolveConfig(path), filepath:path})}));' src/lib/jarvis/contracts.ts src/lib/jarvis/planner.server.ts tests/security/planner.test.ts tests/security/verification.test.ts tests/security/readiness.test.ts tests/security/recovery.test.ts tests/security/objective.test.ts tests/security/confirmation.test.ts src/lib/jarvis/authority.server.ts src/lib/jarvis/supervisor.ts scripts/launch-readiness.mjs tests/jarvis/contracts.test.ts tests/jarvis/e2e.test.ts src/lib/jarvis/objective.ts src/lib/jarvis/functions.ts src/jarvis/JarvisWorkspace.tsx src/jarvis/JarvisBubble.tsx src/routes/ocade-jarvis.tsx ToRemove.md evidence/readiness/gates.json .github/workflows/jarvis-cloud-validation.yml


  windows-effects-safety:
    name: Native receipt / COM / process safety · Windows
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the locked runtime (synthetic failure contracts only)
        run: python -m pip install -r device-agent/windows/requirements.txt
      - name: Native bridge dispatch/readback, COM balance and owned process exit (required, no skips)
        working-directory: device-agent/windows
        run: python -c 'import sys, unittest; suite=unittest.defaultTestLoader.loadTestsFromNames(["tests.test_effect_receipts", "tests.test_quiescence"]); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if result.wasSuccessful() and result.testsRun == 4 and not result.skipped else 1)'

  contracts-db:
    needs: [planner-safety, windows-effects-safety]
    name: Portable build / model contracts / ephemeral DB · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: jarvis_disposable_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: jarvis_disposable_ci_only
      # Placeholder client configuration for the audited CI build: no real project is named or reached.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install exact JS dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install companion runtime for end-to-end tests (test runner only)
        run: python -m pip install -r device-agent/windows/requirements.txt
      - name: Install disposable Postgres test client and the office engine the workers drive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client libreoffice-calc libreoffice-writer
      - name: Standard source and build gates
        run: npm run verify:full
      - name: JARVIS protocol matches checked-in contracts
        if: success() || failure()
        run: npm run jarvis:protocol-check
      - name: No application-specific production journeys
        if: success() || failure()
        run: npm run jarvis:no-hardcoded
      - name: JARVIS contracts, safety and end-to-end tests (real DB, real workers; scripted model)
        if: success() || failure()
        run: node --experimental-strip-types --no-warnings --test tests/jarvis/*.test.ts tests/security/*.test.ts
      - name: Complete disposable database authority tests
        if: success() || failure()
        run: npm run test:jarvis-db
      - name: Logical backup restore and corrupt-archive negative control (fresh runner databases only)
        if: success() || failure()
        env:
          OCADE_DISPOSABLE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash tests/jarvis/db/restore.sh
      - name: Website surface audit (built site served locally; every reachable page, desktop and phone)
        if: success() || failure()
        run: |
          python -m playwright install chromium
          test -f .output/server/index.mjs || npm run build
          npx wrangler dev --ip 127.0.0.1 --port 8787 --local > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8787/ && break; sleep 2; done
          python tests/web/surface_audit.py http://127.0.0.1:8787
          python tests/web/objective_handoff.py http://127.0.0.1:8787
      - name: Launch readiness is computed only from existing evidence
        if: success() || failure()
        run: |
          npm run readiness -- --write
          node --input-type=module -e 'import fs from "node:fs"; console.log("OCADE_READINESS:" + JSON.stringify(fs.readFileSync("evidence/readiness/READINESS.md", "utf8")));'
      - name: Known-vulnerability audit of shipped dependencies (web and companion)
        if: success() || failure()
        run: |
          npm audit --omit=dev
          python -m pip install pip-audit==2.10.1
          pip-audit -r device-agent/windows/requirements.txt

  companion-cross-platform:
    needs: [planner-safety, contracts-db]
    name: Python MCP / journal / browser · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked companion dependencies on test runner only
        run: python -m pip install -r device-agent/windows/requirements.txt
      - name: Install test-only PDF fixture builder (never shipped to customers)
        run: python -m pip install reportlab==4.5.1
      - name: Install test-only Chromium
        run: python -m playwright install chromium
      - name: Expose the installed Playwright browser executable to fixture tests
        shell: bash
        run: |
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("OCADE_BROWSER_EXECUTABLE=" + p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Install test-runner engines (ffmpeg, LibreOffice) on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libreoffice-calc libreoffice-writer
      - name: Install test-runner engines (ffmpeg, LibreOffice) on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # Not added to PATH: LibreOffice's folder holds its own python.exe, and OCADE finds it where it installs.
        run: choco install ffmpeg libreoffice-fresh --yes --no-progress
      - name: Install test-runner engines (ffmpeg, LibreOffice) on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          brew install --cask libreoffice
      # Every skip must be one this OS is allowed; any other skipped test fails the job.
      - name: Linux companion tests (real Chromium on a disposable Xvfb desktop)
        if: runner.os == 'Linux'
        working-directory: device-agent/windows
        run: xvfb-run -a python -m tests.run_required "needs a Windows desktop" "needs Windows process handles" "needs Windows UI Automation and COM" "needs a Mac desktop with Accessibility granted" "needs a display and OCADE_PUBLIC_WEB=1"
      - name: Windows companion tests (real desktop UI, browser, shell)
        if: runner.os == 'Windows'
        working-directory: device-agent/windows
        run: python -m tests.run_required "Start-Process children do not inherit the command's output" "needs a Mac desktop with Accessibility granted" "needs a display and OCADE_PUBLIC_WEB=1"
      - name: Probe whether this macOS runner grants Accessibility trust (decides if AX can be qualified here)
        if: runner.os == 'macOS'
        run: python -c "import ctypes; ax = ctypes.cdll.LoadLibrary('/System/Library/Frameworks/ApplicationServices.framework/ApplicationServices'); print('AXIsProcessTrusted =', ax.AXIsProcessTrusted())"
      - name: macOS companion tests
        if: runner.os == 'macOS'
        working-directory: device-agent/windows
        run: python -m tests.run_required "needs a Windows desktop" "needs Windows process handles" "needs Windows UI Automation and COM" "needs a display and OCADE_PUBLIC_WEB=1"
      # These tests exercise portable contracts; they do NOT establish real
      # foreground UI automation, macOS AX, customer pairing, or actual media quality.

  windows-installer-smoke:
    needs: [planner-safety, contracts-db]
    name: Windows unsigned installer / frozen MCP smoke · NOT release-ready
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0" # a fixed hash seed is part of a reproducible PyInstaller build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build-only Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Measure the original full browser payload from the same pinned SDK
        shell: pwsh
        run: |
          python -m pip install playwright==1.64.1
          $baseline = Join-Path $env:RUNNER_TEMP "ocade-browser-baseline"
          "OCADE_BROWSER_BASELINE=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:PLAYWRIGHT_BROWSERS_PATH = $baseline
          python -m playwright install chromium
      - name: Build disposable unsigned companion installer
        shell: pwsh
        run: |
          # PyInstaller stamps the build time into each Windows executable unless this is set.
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          "SOURCE_DATE_EPOCH=$env:SOURCE_DATE_EPOCH" | Out-File -FilePath $env:GITHUB_ENV -Append
          ./device-agent/windows/packaging/build.ps1
      - name: Only the unused headless shell was removed; retained browser files are identical
        shell: pwsh
        run: |
          & ./device-agent/windows/.build-venv/Scripts/python.exe ./device-agent/windows/packaging/compare_browser_payloads.py "$env:OCADE_BROWSER_BASELINE" "device-agent/windows/packaging/playwright-browsers"
      - name: Verify all frozen MCP workers and the real bundled browser actually start
        shell: pwsh
        run: |
          & ./device-agent/windows/.build-venv/Scripts/python.exe ./device-agent/windows/packaging/check_frozen.py "device-agent/windows/dist/OCADE JARVIS/ocade-agent.exe"
      - name: Rebuild the frozen bundle from the same inputs and require identical files
        shell: pwsh
        working-directory: device-agent/windows/packaging
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path (Get-Location) "playwright-browsers"
          ..\.build-venv\Scripts\pyinstaller --noconfirm --distpath ..\dist2 --workpath ..\build2 ocade-agent.spec
          ..\.build-venv\Scripts\python compare_builds.py "..\dist\OCADE JARVIS" "..\dist2\OCADE JARVIS"
          $stamp = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:SOURCE_DATE_EPOCH).UtcDateTime
          Get-ChildItem ..\dist2 -Recurse -File | ForEach-Object { $_.LastWriteTimeUtc = $stamp }
          iscc /DDist=..\dist2 /O"Output2" ocade-agent.iss  # the second installer from the second, rebuilt bundle
          ..\.build-venv\Scripts\python compare_builds.py Output Output2
      - name: Installer lifecycle - install, diagnose, repair, uninstall; the person's files survive
        shell: pwsh
        run: ./device-agent/windows/packaging/test_install.ps1 -Installer "device-agent/windows/packaging/Output/OCADE-JARVIS-Setup-0.1.0.exe"
      - name: Verify expected installer exists
        shell: pwsh
        run: |
          $installer = "device-agent/windows/packaging/Output/OCADE-JARVIS-Setup-0.1.0.exe"
          if (!(Test-Path $installer)) { throw "Installer missing: $installer" }
          Get-FileHash $installer -Algorithm SHA256 | Select-Object -Property Algorithm,Hash
          Write-Output ("OCADE_INSTALLER_BYTES:" + (Get-Item -LiteralPath $installer).Length)
      # No publishing, signing, user-PC control, deploy, provider calls or secrets.
