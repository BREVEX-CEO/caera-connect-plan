# GitHub CodeQL code scanning cannot upload results for a private GitHub Free repository.
# This weekly dependency audit uses the available free hosted-runner allowance instead.
# It is NOT a replacement for CodeQL static analysis, and must not be reported as such.
# Push/PR CI separately runs verify:full (including lint and built-bundle secret checks)
# plus npm audit. Keep both security paths visible and fail on real findings.
name: Private-repo dependency security

on:
  schedule:
    # Check for newly disclosed production dependency vulnerabilities once a week.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-dependencies:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact lockfile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node and npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Fail on newly disclosed production dependency vulnerabilities
        run: npm audit --omit=dev
