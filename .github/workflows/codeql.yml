# GitHub CodeQL code scanning cannot upload results for a private GitHub Free repository.
# Two checks run instead: the production dependency audit, and Semgrep static analysis
# (registry rules for TypeScript, Python and secrets, no account, no upload) that fails on
# any finding. Reviewed by-design findings carry an inline `nosemgrep` with the reason.
# This is automated SAST, not an independent human security review (SEC-17 still needs one).
# Push/PR CI separately runs verify:full (including lint and built-bundle secret checks)
# plus npm audit. Keep both security paths visible and fail on real findings.
name: Private-repo dependency and static security

on:
  push:
    branches: ["ocade/p00-p22-implementation"]
  schedule:
    # Check for newly disclosed production dependency vulnerabilities once a week.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-dependencies:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact lockfile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node and npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Fail on newly disclosed production dependency vulnerabilities
        run: npm audit --omit=dev

  static-analysis:
    name: Semgrep static analysis (fails on any finding)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the pinned scanner
        run: python -m pip install semgrep==1.186.0

      - name: Scan the website, Edge Functions and companion
        run: >-
          semgrep scan --config p/typescript --config p/python --config p/secrets
          --metrics=off --error src supabase/functions device-agent/windows/ocade_agent
