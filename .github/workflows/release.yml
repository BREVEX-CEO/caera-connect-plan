name: Desktop Packaging (disabled for free launch)

# Desktop distribution is intentionally withdrawn for the current launch. Keep
# the workflow source so signing/packaging can be re-enabled deliberately later,
# but do not build or publish an EXE from tags while the product has no verified
# updater/signing/notarization release channel.
on:
  workflow_dispatch:

jobs:
  desktop-release-disabled:
    if: ${{ false }}
    runs-on: windows-latest
    steps:
      - run: echo "Desktop installer publishing is disabled for the current free launch."
