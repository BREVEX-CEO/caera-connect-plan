name: Windows Beta Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        
    - name: Install dependencies
      run: npm ci

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Tesseract OCR
      run: choco install tesseract --yes --no-progress

    - name: Install pinned Python control stack
      shell: pwsh
      run: |
        python -m venv .venv
        .\.venv\Scripts\python.exe -m pip install --upgrade pip
        .\.venv\Scripts\python.exe -m pip install -r native/python-host/requirements.lock.txt
        .\.venv\Scripts\python.exe -m pip check

    - name: Verify and build native sidecars
      run: |
        npm run python:models
        npm run python:lint
        npm run python:typecheck
        npm run python:test
        npm run browser:sidecar-build
        npm run python:sidecar-build

    - name: Test both packaged sidecars through the Rust supervisor
      working-directory: native/companion/tauri
      shell: pwsh
      run: |
        $env:OCADE_REQUIRE_BROWSER_SIDECAR_TEST = "1"
        $env:OCADE_REQUIRE_PYTHON_SIDECAR_TEST = "1"
        cargo test --all-targets

    - name: Build Web App
      run: npm run build

    - name: Build Tauri App
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      with:
        tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
        releaseName: 'App v__VERSION__'
        releaseBody: 'See the assets to download this version and install.'
        releaseDraft: true
        prerelease: false
        projectPath: ./native/companion/tauri
