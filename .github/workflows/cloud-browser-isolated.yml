# Manual, cloud-only end-to-end browser tests. No owner PC, no production credentials.
# Kept separate from the lightweight push/PR CI to protect GitHub Free minutes.
name: Cloud browser journeys (isolated)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloud-browser-isolated.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or SHA of OCADE to test (no secrets or deployed services)
        required: true
        default: ocade/p00-p22-implementation
        type: string
      suite:
        description: Which isolated browser journeys to execute
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - broad
          - offline-real
          - jarvis
          - live
      live_tasks:
        description: For the live suite, which tasks (research,video,photo); empty runs all
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-browser-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright browsers · disposable Ubuntu
    runs-on: ubuntu-latest
    # Live tasks are long, one prompt each, three in a run.
    timeout-minutes: ${{ inputs.suite == 'live' && 90 || 35 }}
    env:
      # Never point the harness at an account, real database, or deployed site.
      CI: "true"
    steps:
      - name: Checkout requested branch in cloud only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_ref }}
          persist-credentials: false
          submodules: true

      - name: Use project Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install exact project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated Chromium, Firefox and WebKit
        run: node node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit

      - name: Install the Device Agent's Python runtime for the JARVIS journeys
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'jarvis' || inputs.suite == 'live')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth xdotool bubblewrap
          # Ubuntu 24.04 forbids unprivileged namespaces by default; this throwaway VM allows
          # them so the Device Agent's bubblewrap sandbox can confine commands, as on a desktop
          # where the person allowed it. The agent itself checks that it really works.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # A spoken question for the real-speech check, played into Chrome's fake microphone.
          sudo apt-get install -y espeak-ng
          espeak-ng -s 140 -w "${RUNNER_TEMP}/question.wav" "What is the capital of France?"
          echo "OCADE_SPEECH_WAV=${RUNNER_TEMP}/question.wav" >> "$GITHUB_ENV"
          echo "OCADE_SPEECH_BROWSER=$(command -v google-chrome || true)" >> "$GITHUB_ENV"
          python3 -m pip install --disable-pip-version-check -r jarvis-runtime/requirements-agent.txt
          python3 -m playwright install --with-deps chromium

      - name: Put the real Offline Intelligence release in the local test bucket
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'offline-real'
        shell: bash
        env:
          # Read from the private bucket with the owner's read-only R2 key over R2's S3 API:
          # the bucket stays private, and nothing here is public or written back.
          AWS_ACCESS_KEY_ID: ${{ secrets.OCADE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCADE_R2_SECRET_ACCESS_KEY }}
          OCADE_R2_ENDPOINT: ${{ secrets.OCADE_R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
          # R2 does not implement the CLI's default CRC request checksums.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          release=$(node -p "require('./release/OCADE_OFFLINE_RELEASE.json').releaseId")
          digest=$(node -p "require('./release/OCADE_OFFLINE_RELEASE.json').sha256")
          size=$(node -p "require('./release/OCADE_OFFLINE_RELEASE.json').totalBytes")
          artifact="${RUNNER_TEMP}/offline-release.bin"
          # The endpoint may be given with the bucket on the end; the S3 API wants the account root.
          endpoint="${OCADE_R2_ENDPOINT%/}"
          endpoint="${endpoint%/ocade-private-models}"
          aws s3api get-object --endpoint-url "${endpoint}" --bucket ocade-private-models             --key "r/${release}/a" "${artifact}" > /dev/null
          test "$(stat -c %s "${artifact}")" = "${size}" || { echo "::error::size differs from the manifest"; exit 1; }
          echo "${digest}  ${artifact}" | sha256sum --check --status
          echo "private R2 object r/${release}/a: ${size} bytes, SHA-256 matches the manifest"
          node -e "const c=require('./wrangler.json'); delete c.routes; require('fs').writeFileSync('wrangler.e2e.json', JSON.stringify(c,null,2))"
          node node_modules/wrangler/bin/wrangler.js r2 object put "ocade-private-models/r/${release}/a"             --file "${artifact}" --local --config wrangler.e2e.json
          rm -f "${artifact}"

      - name: The staging key can see the pinned model (a metadata read, no generation)
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'live'
        shell: bash
        env:
          KEY: ${{ secrets.OCADE_STAGING_GEMINI_KEY }}
        run: |
          set -euo pipefail
          model=$(node -p "require('fs').readFileSync('src/lib/intelligence/online-models.ts','utf8').match(/DEFAULT_ONLINE_MODEL[^=]*= \"([^\"]+)\"/)[1]")
          curl -fsS -H "x-goog-api-key: ${KEY}" "https://generativelanguage.googleapis.com/v1beta/models/${model}"             | node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log('pinned model visible:',m.name,'|',m.displayName,'| methods:',m.supportedGenerationMethods.join(','),'| thinking:',m.thinking)"

      - name: Whether this key may use web-search grounding (one tiny request)
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'live'
        shell: bash
        env:
          KEY: ${{ secrets.OCADE_STAGING_GEMINI_KEY }}
        run: |
          set -uo pipefail
          model=$(node -p "require('fs').readFileSync('src/lib/intelligence/online-models.ts','utf8').match(/DEFAULT_ONLINE_MODEL[^=]*= \"([^\"]+)\"/)[1]")
          # Google lists grounding as not available on the free tier; this records what the key gets.
          body='{"contents":[{"role":"user","parts":[{"text":"Reply with the word OK."}]}],"tools":[{"google_search":{}}]}'
          code=$(curl -sS -o "${RUNNER_TEMP}/grounding.json" -w "%{http_code}" -H "x-goog-api-key: ${KEY}" -H "content-type: application/json" -d "${body}" "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent")
          echo "grounding probe HTTP ${code}"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log(r.error?('refused: '+r.error.status+' '+String(r.error.message).slice(0,300)):('answered; grounded: '+Boolean(r.candidates?.[0]?.groundingMetadata)))" "${RUNNER_TEMP}/grounding.json"

      - name: Run real browser journeys against local synthetic accounts
        shell: bash
        env:
          # Only the live suite gets the capped staging model key; every other suite is scripted.
          OCADE_LIVE_GEMINI_KEY: ${{ inputs.suite == 'live' && secrets.OCADE_STAGING_GEMINI_KEY || '' }}
          OCADE_LIVE_MAX_CALLS: "150"
          OCADE_LIVE_TASKS: ${{ inputs.live_tasks }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ inputs.suite }}" == "smoke" ]]; then
            journeys=(shell auth chat browsers)
          elif [[ "${{ inputs.suite }}" == "jarvis" ]]; then
            # The real Device Agent on this disposable Linux VM; the model's turns are scripted.
            journeys=(jarvis carry-on)
          elif [[ "${{ inputs.suite }}" == "live" ]]; then
            # One request planned by real Gemini (a capped staging key), on the real Device Agent.
            journeys=(live)
          elif [[ "${{ inputs.suite }}" == "offline-real" ]]; then
            # The real release, installed in the browser and answering with the network cut off.
            journeys=(offline-real)
          else
            # Excludes native Office and Android: those cannot be proved by Playwright.
            # Real Gemini is not used here; the fixture deliberately scripts model outputs.
            # carry-on runs with the real Device Agent in the 'jarvis' suite.
            journeys=(shell auth chat usage pricing online offline library settings polish final visual browsers admin bubble mfa push controls)
          fi
          # Google Chrome on this VM has a real push service; Playwright's Chromium has none.
          export OCADE_PUSH_BROWSER="$(command -v google-chrome || true)"
          run=(node scripts/e2e/harness.mjs "${journeys[@]}")
          # A virtual display on this throwaway VM: the Device Agent's screen tests and the real
          # browser with a push service need one.
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y xvfb xauth; }
          run=(xvfb-run -a "${run[@]}")
          "${run[@]}" 2>&1 | tee "${RUNNER_TEMP}/ocade-browser-result.log"
          if grep -Eq '(^|[[:space:]])BLOCKED([[:space:]]|$)' "${RUNNER_TEMP}/ocade-browser-result.log"; then
            echo "::error::Required browser journey reported BLOCKED, so the run is not an acceptance pass"
            exit 1
          fi

      # Storage is already near its free allowance: no screenshots, traces, or
      # artifact uploads by default. Failures remain visible in job logs.
