# Manual, cloud-only end-to-end browser tests. No owner PC, no production credentials.
# Kept separate from the lightweight push/PR CI to protect GitHub Free minutes.
name: Cloud browser journeys (isolated)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloud-browser-isolated.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or SHA of OCADE to test (no secrets or deployed services)
        required: true
        default: ocade/p00-p22-implementation
        type: string
      suite:
        description: Which isolated browser journeys to execute
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - broad
          - offline-real
          - jarvis

permissions:
  contents: read

concurrency:
  group: cloud-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright browsers · disposable Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Never point the harness at an account, real database, or deployed site.
      CI: "true"
    steps:
      - name: Checkout requested branch in cloud only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_ref }}
          persist-credentials: false

      - name: Use project Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install exact project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated Chromium, Firefox and WebKit
        run: node node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit

      - name: Install the Device Agent's Python runtime for the JARVIS journeys
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'jarvis'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth xdotool bubblewrap
          # Ubuntu 24.04 forbids unprivileged namespaces by default; this throwaway VM allows
          # them so the Device Agent's bubblewrap sandbox can confine commands, as on a desktop
          # where the person allowed it. The agent itself checks that it really works.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m pip install --disable-pip-version-check -r jarvis-runtime/requirements-agent.txt
          python3 -m playwright install --with-deps chromium

      - name: Put the real Offline Intelligence release in the local test bucket
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'offline-real'
        shell: bash
        env:
          OCADE_OFFLINE_SOURCE_URL: ${{ secrets.OCADE_OFFLINE_SOURCE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${OCADE_OFFLINE_SOURCE_URL}" ]]; then
            echo "::error::BLOCKED: no OCADE_OFFLINE_SOURCE_URL secret for the real release"
            exit 1
          fi
          release=$(node -p "require('./release/OCADE_OFFLINE_RELEASE.json').releaseId")
          digest=$(node -p "require('./release/OCADE_OFFLINE_RELEASE.json').sha256")
          artifact="${RUNNER_TEMP}/offline-release.bin"
          curl -fsSL --retry 3 -o "${artifact}" "${OCADE_OFFLINE_SOURCE_URL}"
          echo "${digest}  ${artifact}" | sha256sum --check --status
          node -e "const c=require('./wrangler.json'); delete c.routes; require('fs').writeFileSync('wrangler.e2e.json', JSON.stringify(c,null,2))"
          node node_modules/wrangler/bin/wrangler.js r2 object put "ocade-private-models/r/${release}/a"             --file "${artifact}" --local --config wrangler.e2e.json
          rm -f "${artifact}"

      - name: Run real browser journeys against local synthetic accounts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ inputs.suite }}" == "smoke" ]]; then
            journeys=(shell auth chat browsers)
          elif [[ "${{ inputs.suite }}" == "jarvis" ]]; then
            # The real Device Agent on this disposable Linux VM; the model's turns are scripted.
            journeys=(jarvis carry-on)
          elif [[ "${{ inputs.suite }}" == "offline-real" ]]; then
            # The real release, installed in the browser and answering with the network cut off.
            journeys=(offline-real)
          else
            # Excludes native Office and Android: those cannot be proved by Playwright.
            # Real Gemini is not used here; the fixture deliberately scripts model outputs.
            # carry-on runs with the real Device Agent in the 'jarvis' suite.
            journeys=(shell auth chat usage pricing online offline library settings polish final visual browsers admin bubble mfa push controls)
          fi
          # Google Chrome on this VM has a real push service; Playwright's Chromium has none.
          export OCADE_PUSH_BROWSER="$(command -v google-chrome || true)"
          run=(node scripts/e2e/harness.mjs "${journeys[@]}")
          # A virtual display on this throwaway VM: the Device Agent's screen tests and the real
          # browser with a push service need one.
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y xvfb xauth; }
          run=(xvfb-run -a "${run[@]}")
          "${run[@]}" 2>&1 | tee "${RUNNER_TEMP}/ocade-browser-result.log"
          if grep -Eq '(^|[[:space:]])BLOCKED([[:space:]]|$)' "${RUNNER_TEMP}/ocade-browser-result.log"; then
            echo "::error::Required browser journey reported BLOCKED, so the run is not an acceptance pass"
            exit 1
          fi

      # Storage is already near its free allowance: no screenshots, traces, or
      # artifact uploads by default. Failures remain visible in job logs.
