# One-command OCADE relay.
#
#   docker compose up --build
#
# Brings up the relay on http://localhost:8787. Point a paired device at it with
# OCADE_RELAY_URL. Nothing else is required: the relay holds no keys, no
# database and no state that outlives the process.
services:
  relay:
    build:
      context: ./relay
    image: ocade-relay:local
    container_name: ocade-relay
    restart: unless-stopped
    ports:
      - "${OCADE_RELAY_PORT:-8787}:8787"
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      # Generous enough for a sealed envelope with attachments metadata, small
      # enough that a single client cannot exhaust memory.
      MAX_ENVELOPE_BYTES: "262144"
      MAX_SENDS_PER_MINUTE: "600"

    # The relay forwards ciphertext and keeps nothing. Hardening below reflects
    # that: it needs no filesystem, no privileges and no capabilities.
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Bounded so a flood degrades the relay rather than the host.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
