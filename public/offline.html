<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCADE Local Mode</title>
    <meta name="theme-color" content="#0a0a0a" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #e7e7e7;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 1.5rem;
      }
      main {
        max-width: 30rem;
        text-align: center;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.6;
        color: #a2a2a2;
        margin: 0 0 0.75rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.65rem;
        margin-top: 1rem;
      }
      button,
      a {
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
        font: inherit;
        font-size: 0.875rem;
        color: #e7e7e7;
        background: transparent;
        border: 1px solid #323232;
        border-radius: 0.5rem;
        cursor: pointer;
        text-decoration: none;
      }
      button:hover,
      a:hover {
        background: #161616;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OCADE local mode</h1>
      <!--
        Says what is and is not available, rather than "no internet connection".
        A local-first product that stores conversations in the browser vault and
        can run an engine on the device genuinely does keep working here — but
        only the parts that never needed the network, and the user is entitled
        to know which those are before they start typing.
      -->
      <p>
        Network services are unavailable right now; OCADE is keeping your device-only work
        available.
      </p>
      <p>
        Conversations kept in Browser Only or PC Vault storage remain here. A local answer also
        needs an engine that was prepared on this device while connected.
      </p>
      <div class="actions">
        <a href="/ocade">Open OCADE</a>
        <button type="button" onclick="location.reload()">Reconnect</button>
      </div>
      <script>
        addEventListener("online", () => location.reload(), { once: true });
      </script>
    </main>
  </body>
</html>
