[package]
name = "caera-companion"
version = "0.1.0"
edition = "2021"
description = "CAERA Native Companion — signed desktop agent that performs bounded, permission-gated OCADE actions."
license = "UNLICENSED"
publish = false

# The security core is a separate, dependency-free crate so it can be audited
# and tested without pulling the whole Tauri toolchain.
[dependencies]
caera-companion-safety = { path = "../safety", features = ["serde"] }
# OS CSPRNG for minting session keys host-side. The web page never chooses key
# material, so a compromised page cannot pre-compute a valid MAC.
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
# Signed auto-update. The config in tauri.conf.json is inert without this.
tauri-plugin-updater = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []

[[bin]]
name = "caera-companion"
path = "src/main.rs"

# Release profile favours a small, fast, signed binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
