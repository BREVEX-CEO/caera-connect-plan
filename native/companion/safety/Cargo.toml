[package]
name = "caera-companion-safety"
version = "0.1.0"
edition = "2021"
description = "Host-side safety enforcement for the OCADE Native Companion (risk tiers, protected-input refusal, allowlists, audit redaction)."
license = "UNLICENSED"
publish = false

# Intentionally dependency-free BY DEFAULT: the security core must be auditable
# and must compile and test without any network access. The optional `serde`
# feature is enabled only by the Tauri app crate, which needs to deserialise
# actions arriving over IPC.
[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[lib]
path = "src/lib.rs"
