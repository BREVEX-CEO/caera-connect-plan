<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OCADE JARVIS</title>
    <style>
      body {
        font:
          13px system-ui,
          sans-serif;
        margin: 0;
        padding: 14px;
        width: 260px;
        background: #0e0e11;
        color: #ececf0;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        margin: 6px 0;
        color: #b4b4bc;
      }
      button {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 7px;
        border-radius: 8px;
        border: 1px solid #3a3a42;
        background: #1a1a1f;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #ececf0;
        color: #0e0e11;
        border: 0;
      }
      .mono {
        font-family: ui-monospace, monospace;
        color: #ececf0;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>OCADE JARVIS</h1>
    <p id="status" role="status">Checking…</p>
    <p id="fingerprint" hidden>Fingerprint <span class="mono"></span></p>
    <button id="connect" class="primary" hidden>Connect this browser</button>
    <button id="stop" hidden>STOP JARVIS</button>
    <button id="open">Open OCADE JARVIS</button>
    <button id="forget" hidden>Disconnect this browser</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
