<!doctype html>
<meta charset="utf-8" />
<title>OCADE Cowork</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding: 14px;
    width: 320px;
    font:
      13px/1.45 ui-sans-serif,
      system-ui,
      -apple-system,
      "Segoe UI",
      sans-serif;
    background: #0b0d12;
    color: #e7ecf3;
  }
  h1 {
    font-size: 13px;
    margin: 0 0 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8b97a8;
  }
  .state {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
  }
  .running {
    color: #4ade80;
  }
  .paused {
    color: #fbbf24;
  }
  .stopped {
    color: #f87171;
  }
  .handed_over {
    color: #60a5fa;
  }
  .row {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  button {
    flex: 1;
    padding: 7px 8px;
    border-radius: 7px;
    cursor: pointer;
    border: 1px solid #263041;
    background: #141924;
    color: #e7ecf3;
    font: inherit;
  }
  button:hover {
    background: #1c2331;
  }
  button.stop {
    border-color: #7f1d1d;
    color: #fca5a5;
  }
  h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #8b97a8;
    margin: 14px 0 6px;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #1a2130;
  }
  li span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  li button {
    flex: 0 0 auto;
    padding: 3px 8px;
    font-size: 11px;
  }
  .empty,
  .note {
    color: #8b97a8;
    font-size: 12px;
  }
  .note {
    margin-top: 10px;
  }
  #handover {
    display: none;
    margin-bottom: 12px;
    padding: 8px;
    border-radius: 7px;
    border: 1px solid #1e3a5f;
    background: #10203a;
    color: #bfdbfe;
    font-size: 12px;
  }
</style>
<h1>OCADE Cowork</h1>
<div class="state" id="state"><span class="dot"></span><span id="stateText">…</span></div>
<div id="handover"></div>
<div class="row">
  <button id="pause">Pause</button>
  <button id="resume">Resume</button>
  <button id="stop" class="stop">Stop</button>
</div>
<button id="takeover">Take over this tab</button>
<h2>Sites OCADE may act on</h2>
<ul id="origins"></ul>
<button id="approve" style="margin-top: 8px">Approve this site</button>
<p class="note">
  OCADE only acts on the sites listed here, and never types a password, one-time code, CVV, PIN,
  CAPTCHA or recovery code — it hands those back to you.
</p>
<script type="module" src="popup.js"></script>
